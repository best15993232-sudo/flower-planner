name: 학사일정 갱신
on:
  schedule:
    - cron: "0 18 * * 0"      # 매주 월요일 03:00 (한국시간)
  workflow_dispatch:           # 수동 실행 버튼
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 분류 규칙 테스트
        run: python3 scripts/test_classify.py
      - name: 학사일정 조회
        env:
          NEIS_KEY: ${{ secrets.NEIS_KEY }}     # 저장소 Settings > Secrets 에 등록
        run: |
          EXTRA=""
          [ "$(date +%d)" -le 7 ] && EXTRA="--refresh-directory"   # 매달 첫 주에는 신설 학교·주소도 갱신
          python3 scripts/update_schools.py --max 13000 $EXTRA
      - name: 변경분 커밋
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/schools.json
          git diff --cached --quiet || (git commit -m "data: 학사일정 갱신 $(date +%F)" && git push)
