name: 옛 주소 동 이름 채우기
on:
  workflow_dispatch:
  push:
    paths: [scripts/fetch_dongs.py]      # 처음 한 번 자동 실행
  schedule:
    - cron: "40 18 3 * *"               # 매달 4일 새벽 3시 40분(한국): 새로 생긴 학교만 채워요
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  dongs:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: 동 이름 찾기
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: |
          python3 scripts/fetch_dongs.py
          python3 scripts/build_events.py
      - name: 결과 커밋
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/place_dongs.json data/places.json data/events.json
          git diff --cached --quiet || (git commit -m "data: 옛 주소 동 이름" && git pull --rebase -q && git push)
