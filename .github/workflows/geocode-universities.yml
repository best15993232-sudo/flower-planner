name: 대학 좌표 채우기
on:
  workflow_dispatch:      # 수동 실행 전용 (한 번만 돌리면 돼요. 좌표가 있는 곳은 건너뛰어요)
permissions:
  contents: write
jobs:
  geocode:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 주소 → 좌표 변환
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: python3 scripts/geocode_universities.py
      - name: 결과 커밋
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/universities.json
          git diff --cached --quiet || (git commit -m "data: 대학 좌표 채우기" && git pull --rebase -q && git push)
