name: 좌표 채우기 (대학·누락 학교)
on:
  workflow_dispatch:      # 수동 실행 전용 (한 번만 돌리면 돼요. 좌표가 있는 곳은 건너뛰어요)
permissions:
  contents: write
concurrency:
  group: update-data   # 학사일정 갱신과 같은 파일을 고쳐서 차례로 돌려요
  cancel-in-progress: false
jobs:
  geocode:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: 주소 → 좌표 변환
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: |
          python3 scripts/geocode_universities.py
          python3 scripts/geocode_missing.py
          python3 scripts/build_events.py
      - name: 결과 커밋
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/universities.json data/schools.json data/places.json data/events.json
          git diff --cached --quiet || (git commit -m "data: 좌표 보충" && git pull --rebase -q && git push)
