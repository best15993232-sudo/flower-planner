<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f0">
<title>꽃 판매 플래너 · 졸업식 일정</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#f6f5f0; --card:#fff; --ink:#1d2b24; --ink2:#5d6d63; --ink3:#8a978e;
  --line:#e6e9e2; --brand:#1f5a43; --brand-d:#174634; --brand-soft:#e8f2ec;
  --rose:#c4486b; --rose-soft:#fbeaf0; --amber:#9a6a14; --amber-soft:#fff3d9;
  --r:16px; --gut:20px; --tab:60px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:15px;line-height:1.5;letter-spacing:-.2px}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.wrap{max-width:640px;margin:0 auto;padding:0 var(--gut) calc(var(--tab) + 40px + env(safe-area-inset-bottom))}

/* top */
.top{padding:22px 0 14px}
.brand{font-size:20px;font-weight:800;letter-spacing:-.6px}
.sub{margin:4px 0 0;color:var(--ink2);font-size:13px}
.sticky{position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 0 12px;margin:0 calc(var(--gut) * -1);padding-left:var(--gut);padding-right:var(--gut)}
.search{position:relative;display:block}
.search input{width:100%;height:50px;border:1.5px solid var(--line);border-radius:14px;background:#fff;padding:0 16px 0 44px;font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s;-webkit-appearance:none}
.search input:focus{border-color:var(--brand);box-shadow:0 0 0 4px #1f5a4318}
.search svg{position:absolute;left:15px;top:15px;width:20px;height:20px;stroke:var(--ink3)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#e9ebe4;border-radius:12px;padding:4px;margin-top:10px}
.seg button{height:38px;border-radius:9px;font-size:14px;font-weight:700;color:var(--ink2);transition:.15s}
.seg button[aria-pressed=true]{background:#fff;color:var(--brand);box-shadow:0 1px 4px #0000001a}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px var(--gut) 14px;margin:0 calc(var(--gut) * -1);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 15px;border-radius:19px;border:1.5px solid var(--line);background:#fff;font-size:14px;font-weight:600;color:var(--ink2)}
.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.chip-select{position:relative;flex:none}
.chip-select select{height:38px;appearance:none;-webkit-appearance:none;border:1.5px solid var(--line);border-radius:19px;background:#fff;padding:0 32px 0 15px;font-size:14px;font-weight:600;color:var(--ink2);outline:none}
.chip-select select.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip-select::after{content:"";position:absolute;right:14px;top:15px;width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);pointer-events:none;color:var(--ink3)}
.chip-select:has(select.on)::after{color:#fff}
.count{display:flex;justify-content:space-between;align-items:center;color:var(--ink2);font-size:13px;margin:2px 2px 10px}
.count b{color:var(--ink)}
.linkbtn{color:var(--brand);font-weight:700;font-size:13px;padding:6px 2px}

/* school card */
.list{display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;cursor:pointer;transition:box-shadow .15s}
.card:active{box-shadow:0 0 0 3px #1f5a4314}
.meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2)}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;background:var(--brand-soft);color:var(--brand);font-weight:700;font-size:11px}
.name{font-size:17px;font-weight:800;letter-spacing:-.4px;line-height:1.35}
.addr{font-size:13px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:12px}
.date{min-width:0}
.date b{display:block;font-size:16px;font-weight:800;letter-spacing:-.3px}
.date small{font-size:12px;color:var(--rose);font-weight:700}
.date small.far{color:var(--ink3);font-weight:600}
.date.none b{font-size:14px;color:var(--ink2);font-weight:700}
.date.warn b{color:var(--amber)}
.add{flex:none;height:46px;min-width:104px;padding:0 18px;border-radius:12px;background:var(--brand);color:#fff;font-weight:800;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .15s,transform .1s}
.add:active{transform:scale(.96);background:var(--brand-d)}
.add.done{background:var(--brand-soft);color:var(--brand)}
.add.alt{background:#fff;color:var(--brand);border:1.5px solid var(--brand)}
.add.alt.done{background:var(--brand-soft);border-color:var(--brand-soft)}
.more{width:100%;height:50px;margin-top:14px;border-radius:14px;background:#fff;border:1.5px solid var(--line);font-weight:700;color:var(--ink2)}
.empty{text-align:center;padding:48px 16px;color:var(--ink2);font-size:14px;line-height:1.7}
.empty .big{font-size:36px;display:block;margin-bottom:8px}
.empty .btn{margin-top:16px}

/* buttons */
.btn{height:50px;padding:0 20px;border-radius:13px;background:var(--brand);color:#fff;font-weight:800;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;width:100%}
.btn:active{background:var(--brand-d)}
.btn.soft{background:var(--brand-soft);color:var(--brand)}
.btn.line{background:#fff;color:var(--ink2);border:1.5px solid var(--line)}
.btn.sm{height:42px;font-size:14px;width:auto;padding:0 16px}
.btn.danger{background:#fff;color:#b3402e;border:1.5px solid #f0d4cf}

/* schedule */
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.sum div{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.sum b{display:block;font-size:24px;font-weight:800;letter-spacing:-.6px}
.sum span{font-size:12px;color:var(--ink2)}
.group{margin-bottom:22px}
.group h3{display:flex;justify-content:space-between;align-items:baseline;font-size:16px;margin:0 2px 10px}
.group h3 small{color:var(--rose);font-weight:700;font-size:13px}
.scard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:10px}
.scard-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.scard .name{font-size:16px}
.tag{flex:none;font-size:11px;font-weight:700;padding:3px 8px;border-radius:10px;background:var(--brand-soft);color:var(--brand)}
.tag.manual{background:var(--amber-soft);color:var(--amber)}
.qty{display:flex;align-items:center;justify-content:space-between;margin:14px 0 10px;padding:10px 12px;background:var(--bg);border-radius:12px}
.qty label{font-size:13px;font-weight:700;color:var(--ink2)}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:40px;height:40px;border-radius:10px;background:#fff;border:1.5px solid var(--line);font-size:20px;font-weight:700;color:var(--brand)}
.stepper input{width:56px;height:40px;text-align:center;border:0;background:transparent;font-size:17px;font-weight:800;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
.memo{width:100%;min-height:72px;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:15px;resize:vertical;outline:none;background:#fff}
.memo:focus,.dinput:focus{border-color:var(--brand)}
.sactions{display:flex;gap:8px;margin-top:10px}
.sactions .btn{flex:1}
.backup{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:8px}
.backup p{margin:0 0 12px;font-size:12px;color:var(--ink3);line-height:1.6}
.backup .row{display:flex;gap:8px}
.backup .btn{flex:1}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#ffffffee;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar-in{max-width:640px;margin:auto;display:grid;grid-template-columns:1fr 1fr;height:var(--tab)}
.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:700;color:var(--ink3);position:relative}
.tabbar button svg{width:24px;height:24px;stroke:currentColor}
.tabbar button[aria-selected=true]{color:var(--brand)}
.cnt{position:absolute;top:6px;left:calc(50% + 6px);min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--rose);color:#fff;font-size:11px;font-weight:800;display:none;align-items:center;justify-content:center}
.cnt.on{display:flex}
.cnt.pop{animation:pop .35s}
@keyframes pop{40%{transform:scale(1.4)}}

/* sheet */
.scrim{position:fixed;inset:0;background:#10201866;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:640px;margin:auto;background:#fff;border-radius:22px 22px 0 0;max-height:88vh;max-height:88dvh;overflow:auto;transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);padding:10px var(--gut) calc(24px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.sheet.on{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:#d5d9d2;margin:0 auto 14px}
.sheet h2{font-size:22px;letter-spacing:-.6px;margin:6px 0 4px;line-height:1.3}
.sheet .addr{white-space:normal}
.pill{display:inline-block;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:700;background:var(--brand-soft);color:var(--brand);margin-top:12px}
.pill.warn{background:var(--amber-soft);color:var(--amber)}
.pill.muted{background:#eff0ed;color:var(--ink2)}
.bigdate{font-size:26px;font-weight:800;letter-spacing:-.7px;margin:10px 0 2px}
.hint{font-size:12px;color:var(--ink3);line-height:1.6}
.sec{margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}
.sec h4{margin:0 0 4px;font-size:15px}
.cands{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.cands button{height:42px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);font-weight:700;font-size:14px;background:#fff}
.cands button.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.dinput{width:100%;height:50px;border:1.5px solid var(--line);border-radius:13px;padding:0 14px;font-size:16px;margin:10px 0;outline:none;background:#fff}
.links{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.links a{height:48px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;font-weight:700;color:var(--ink);text-decoration:none;line-height:1.2}
.notice{font-size:11.5px;color:var(--ink3);line-height:1.7;margin:16px 0 0}
details summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--ink2);padding:12px 0;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::after{content:" ▾"}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(var(--tab) + 18px + env(safe-area-inset-bottom));transform:translate(-50%,16px);z-index:80;background:#1d2b24;color:#fff;padding:12px 16px;border-radius:14px;font-size:14px;font-weight:600;display:flex;gap:14px;align-items:center;opacity:0;pointer-events:none;transition:.2s;width:max-content;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:#8fe0b4;font-weight:800;padding:4px 2px}
.foot{font-size:11.5px;color:var(--ink3);line-height:1.7;margin:28px 2px 0}
.panel{display:none}.panel.on{display:block}
@media (min-width:700px){.sheet{border-radius:22px;bottom:24px;max-height:84vh}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* v1.1: date window and original event titles for multiple candidates */
.rangebox{background:#fff;border:1px solid var(--line);padding:13px 14px 12px;border-radius:15px;margin:0 0 15px}
.range-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.range-head strong{font-size:14px;letter-spacing:-.1px}
.range-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px}
.range-grid label{display:grid;gap:5px;font-size:11px;color:var(--ink2);font-weight:750}
.range-grid input{display:block;min-width:0;width:100%;height:43px;background:#f8f9f6;border:1px solid #dfe7df;border-radius:9px;padding:0 7px;color:var(--ink);font-size:13px;font-family:inherit;outline:none}
.range-grid input:focus{border-color:var(--brand);background:#fff}
.rangebox p{font-size:11px;line-height:1.5;color:var(--ink3);margin:8px 0 0}
.rangebox p.warnrange{color:#aa622a;font-weight:700}
.event-row{display:block;width:100%;border:1.5px solid var(--line);border-radius:14px;padding:13px;margin:10px 0;background:#fff;text-align:left;cursor:pointer;transition:background .15s,border-color .15s}
.event-row .event-head{display:flex;gap:10px;align-items:center;justify-content:space-between}
.event-row .event-date{font-weight:800;font-size:16px;letter-spacing:-.3px}
.event-row .event-check{display:grid;place-items:center;border:1.7px solid #c7d4c9;border-radius:50%;width:21px;height:21px;color:transparent;font-weight:800;flex:none}
.event-row.on{background:#edf8f0;border-color:var(--brand)}
.event-row.on .event-check{background:var(--brand);border-color:var(--brand);color:#fff}
.event-row .event-sub{font-size:11px;color:var(--ink3);margin:7px 0 6px}
.event-badges{display:flex;flex-wrap:wrap;gap:5px}
.event-label{background:#f0f2ee;color:#4c6156;padding:4px 8px;border-radius:8px;font-size:12px;font-weight:650}
.event-label.primary{background:#e5f3e9;color:#206048}
.sheet .btn[disabled]{opacity:.48;cursor:not-allowed}
.raw-note{font-size:12px;color:#7c8d82;line-height:1.6;margin-top:8px}
.card.sk{cursor:default;pointer-events:none}.sk i{display:block;height:14px;border-radius:7px;background:linear-gradient(90deg,#eceee8 25%,#f5f6f2 50%,#eceee8 75%);background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}
</style>
</head>
<body>
<div class="wrap">

<section class="panel on" id="p-find">
  <div class="top">
    <div class="brand">🌸 꽃 판매 플래너</div>
    <p class="sub">졸업식 날짜를 찾아 내 판매 일정에 담아두세요</p>
  </div>
  <div class="sticky">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="학교 이름이나 지역으로 검색" autocomplete="off" enterkeyhint="search" aria-label="학교 검색">
    </label>
    <div class="seg" id="seg" role="group" aria-label="졸업일 상태">
      <button data-v="confirmed" aria-pressed="true">날짜 확정</button>
      <button data-v="pending" aria-pressed="false">확인 필요</button>
      <button data-v="all" aria-pressed="false">전체</button>
    </div>
  </div>
  <div class="chips" id="chips">
    <button class="chip" data-k="" aria-pressed="true">전체</button>
    <button class="chip" data-k="초등학교" aria-pressed="false">초등</button>
    <button class="chip" data-k="중학교" aria-pressed="false">중학</button>
    <button class="chip" data-k="고등학교" aria-pressed="false">고등</button>
    <span class="chip-select"><select id="region" aria-label="지역"><option value="">전국</option></select></span>
  </div>
  <section class="rangebox" aria-label="졸업식 기간 검색">
    <div class="range-head"><strong>📅 졸업식 기간</strong><button class="linkbtn" id="resetRange" type="button">초기화</button></div>
    <div class="range-grid">
      <label>시작일<input type="date" id="fromDate" aria-label="졸업 시작일" value=""></label>
      <label>종료일<input type="date" id="toDate" aria-label="졸업 종료일" value=""></label>
    </div>
    <p id="rangeHint">기간을 지정하면 해당 날짜에 졸업식이 등록된 학교만 찾아요.</p>
  </section>
  <div class="count"><span id="rc">불러오는 중…</span><button class="linkbtn" id="sort">빠른 날짜순</button></div>
  <div class="list" id="list"></div>
  <button class="more" id="more" hidden>더 보기</button>
  <p class="foot">출처: 나이스 학교기본정보·학사일정 (<span id="upd">—</span> 기준). 졸업식 날짜는 학교 사정에 따라 바뀔 수 있으니 학교 공지를 꼭 확인하세요. 학교 주변 판매 가능 여부는 직접 확인해야 합니다.</p>
</section>

<section class="panel" id="p-plan">
  <div class="top">
    <div class="brand">📅 내 판매 일정</div>
    <p class="sub">날짜별로 모아 보고, 준비 수량을 적어두세요</p>
  </div>
  <div id="plan"></div>
</section>

</div>

<nav class="tabbar" aria-label="메뉴"><div class="tabbar-in">
  <button id="t-find" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>학교 찾기</button>
  <button id="t-plan" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>내 일정<span class="cnt" id="cnt">0</span></button>
</div></nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="학교 상세"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file" accept=".json,application/json" hidden>


<script>
const KEY='flower-planner-preview-2026-v1', PAGE=20;
let SCHOOL_DATA=[],RAW_EVENTS={},REVIEW_DATES={},BY=new Map(),DATA_UPDATED='';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().replace(/\s+/g,'');
const DOW=['일','월','화','수','목','금','토'];
const isOk=s=>s.status==='Graduation found in NEIS'&&s.dates.length===1;
const isNQ=s=>s.status==='not_queried';
const candidateDates=s=>s.dates.length?s.dates:(REVIEW_DATES[s.id]||[]);
const between=(d,f,t)=>(!f||d>=f)&&(!t||d<=t);

const toDate=d=>new Date(+d.slice(0,4),+d.slice(4,6)-1,+d.slice(6,8));
const fmt=d=>{if(!/^\d{8}$/.test(d||''))return '날짜 미공개';const x=toDate(d);return (x.getMonth()+1)+'월 '+x.getDate()+'일 ('+DOW[x.getDay()]+')'};
const fmtY=d=>d.slice(0,4)+'.'+d.slice(4,6)+'.'+d.slice(6,8);
function dday(d){const t=new Date();t.setHours(0,0,0,0);const n=Math.round((toDate(d)-t)/864e5);return n<0?['지남',true]:n===0?['오늘',false]:['D-'+n,n>45]}
function stText(s){
  if(isOk(s))return['학사일정 확인','ok'];
  if(s.status==='Review: multiple graduation dates')return['날짜 후보 여러 개','warn'];
  if(s.status==='Review: ambiguous event name')return['행사명 확인 필요','warn'];
  if(s.status==='Graduation not yet found')return['졸업일 미등록','muted'];
  if(s.status==='No calendar data')return['학사일정 자료 없음','muted'];
  return['아직 조회 전','muted'];
}
const safeUrl=u=>{u=String(u||'').trim();if(!u)return '';if(!/^https?:\/\//i.test(u))u='https://'+u;try{new URL(u);return u}catch{return ''}};

let saved=(()=>{try{const a=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(a)?a:[]}catch{return[]}})();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(saved))}catch{toast('저장하지 못했어요. 백업 파일로 보관해 주세요')}updateCount()}
function updateCount(pop){const c=$('cnt');c.textContent=saved.length;c.classList.toggle('on',saved.length>0);if(pop){c.classList.remove('pop');void c.offsetWidth;c.classList.add('pop')}}
const find=(sid,d)=>saved.find(r=>r.schoolId===sid&&r.date===d);
const anySaved=sid=>saved.filter(r=>r.schoolId===sid);

/* state */
const st={status:'confirmed',kind:'',region:'',sort:'date',shown:PAGE,list:[],tab:'find',open:null};

function filtered(){
  const q=norm($('q').value);
  let m=SCHOOL_DATA.filter(s=>{
    if(st.kind&&s.kind!==st.kind)return false;
    if(st.region&&s.region!==st.region)return false;
    if(st.status==='confirmed'&&!isOk(s))return false;
    if(st.status==='pending'&&(isOk(s)||isNQ(s)))return false;
    if(q&&!norm(s.name+s.address).includes(q))return false;
    const f=$('fromDate').value.replaceAll('-',''), t=$('toDate').value.replaceAll('-','');
    if(f&&t&&f>t)return false;
    if(f||t){const ds=candidateDates(s);if(!ds.some(d=>between(d,f,t)))return false;}
    return true;
  });
  const key=s=>isOk(s)?s.dates[0]:(s.dates[0]||'99999999');
  if(st.sort==='date')m.sort((a,b)=>key(a).localeCompare(key(b))||a.name.localeCompare(b.name,'ko'));
  else m.sort((a,b)=>a.name.localeCompare(b.name,'ko'));
  return m;
}

function cardHtml(s){
  const ok=isOk(s),[label,tone]=stText(s);
  let dateHtml,btn;
  if(ok){
    const d=s.dates[0],[dd,far]=dday(d);
    dateHtml=`<div class="date"><b>${fmt(d)}</b><small class="${far?'far':''}">${dd}</small></div>`;
    const on=!!find(s.id,d);
    btn=`<button class="add ${on?'done':''}" data-add="${esc(s.id)}" aria-pressed="${on}">${on?'✓ 담김':'＋ 담기'}</button>`;
  }else{
    const n=anySaved(s.id).length;
    dateHtml=`<div class="date ${tone==='warn'?'warn':'none'}"><b>${esc(label)}</b><small class="far">${candidateDates(s).length>1?'후보 '+candidateDates(s).length+'개 · 원문 확인':candidateDates(s).length===1?'행사명 원문 확인':'날짜를 직접 입력해요'}</small></div>`;
    btn=`<button class="add alt ${n?'done':''}" data-open="${esc(s.id)}">${n?'✓ 담김':'날짜 입력'}</button>`;
  }
  return `<article class="card" data-card="${esc(s.id)}"><div><div class="meta"><span class="badge">${esc(s.kind)}</span><span>${esc(s.region)}</span></div><div class="name" style="margin-top:8px">${esc(s.name)}</div><div class="addr">${esc(s.address)}</div></div><div class="card-foot">${dateHtml}${btn}</div></article>`;
}

function render(reset=true){
  if(reset){st.list=filtered();st.shown=PAGE}

  $('rc').innerHTML=`<b>${L.length.toLocaleString('ko-KR')}</b>개 학교`;
  $('sort').textContent=st.sort==='date'?'빠른 날짜순':'가나다순';
  $('list').innerHTML=L.slice(0,st.shown).map(cardHtml).join('')||
   `<div class="empty"><span class="big">🔍</span>조건에 맞는 학교가 없어요.<br>${st.status==='confirmed'?'‘전체’로 바꾸면 아직 날짜가 없는 학교도 볼 수 있어요.':'검색어나 지역을 바꿔 보세요.'}</div>`;
  const rest=L.length-st.shown;
  $('more').hidden=rest<=0;
  if(rest>0)$('more').textContent=`더 보기 (${Math.min(PAGE,rest)}개 더 · 남은 ${rest.toLocaleString('ko-KR')}개)`;
}

    body=`<div class="bigdate" style="font-size:20px">${esc(ds.length>1?'날짜 후보가 여러 개예요':label)}</div><div class="hint">같은 학교에 여러 날짜가 등록돼 있어요. 아래 <b>행사명 원문</b>을 비교한 뒤 학교 공지로 확인해 주세요.</div>

function backupHtml(){return `<div class="backup"><b style="font-size:14px">일정 백업</b><p>일정은 이 기기의 브라우저에만 저장돼요. 기록을 지우면 사라질 수 있으니 가끔 백업해 두세요.</p><div class="row"><button class="btn soft sm" data-export>⬇ 백업하기</button><button class="btn line sm" data-import>⬆ 불러오기</button></div></div>`}

function setLoading(){
  $('rc').textContent='학교 목록을 불러오는 중…';
  $('list').innerHTML=Array(4).fill('<div class="card sk" aria-hidden="true"><i style="width:30%"></i><i style="width:60%;height:20px"></i><i style="width:80%"></i><i style="width:45%;height:34px"></i></div>').join('');
}
function showLoadError(){
  $('rc').textContent='';$('more').hidden=true;
  $('list').innerHTML='<div class="empty"><span class="big">📡</span>학교 목록을 불러오지 못했어요.<br>인터넷 연결을 확인하고 다시 시도해 주세요.<br><button class="btn" id="retry" style="max-width:220px;margin:16px auto 0">다시 불러오기</button></div>';
  $('retry').onclick=boot;
}
async function boot(){
  setLoading();
  try{
    let d=window.__INLINE_DATA__;   // 미리보기용(파일 하나로 열 때). 실제 배포에서는 쓰지 않아요
    if(!d){
      const res=await fetch(DATA_URL,{cache:'no-cache'});   // 바뀌었을 때만 새로 받고, 아니면 브라우저 캐시 사용
      if(!res.ok)throw Error('HTTP '+res.status);
      d=await res.json();
    }
    if(!d||!Array.isArray(d.schools))throw Error('bad data');
    SCHOOL_DATA=d.schools;RAW_EVENTS=d.rawEvents||{};REVIEW_DATES=d.reviewDates||{};DATA_UPDATED=d.updatedAt||'';
  }catch(err){console.error(err);showLoadError();return}
  BY=new Map(SCHOOL_DATA.map(s=>[s.id,s]));
  const regs=[...new Set(SCHOOL_DATA.map(s=>s.region))].sort((a,b)=>a.localeCompare(b,'ko'));
  $('region').innerHTML='<option value="">전국</option>'+regs.map(r=>`<option${r===st.region?' selected':''}>${esc(r)}</option>`).join('');
  $('upd').textContent=DATA_UPDATED?DATA_UPDATED.replace(/-/g,'.'):'—';
  updateCount();render();
  if(st.tab==='plan')renderPlan();
}
boot();
</script>
</body>
</html>
